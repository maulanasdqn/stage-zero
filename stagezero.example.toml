[email]
provider = "cloudflare"
from = "hello@yourdomain.com"
from_name = "Your Name"
cloudflare_account_id = ""

[applicant]
name = "Your Name"
email = "you@yourdomain.com"
resume_path = "resume.pdf"
portfolio = "https://yourdomain.com"

max_highlights = 3

[[applicant.highlights]]
text = "Your strongest shipped result, with a number (throughput, revenue, users, time saved)."
keywords = ["infrastructure", "developer tools", "data", "api"]

[[applicant.highlights]]
text = "A product you owned end to end in a specific domain."
keywords = ["fintech", "finance", "payments"]

[[applicant.highlights]]
text = "An AI or automation project with a measurable outcome."
keywords = ["ai", "llm", "agent", "automation"]

[[applicant.highlights]]
text = "Something that proves you can lead or grow a team or community."
keywords = ["community", "consumer", "social"]
pinned = false

[template]
subject = "Founding engineer for {{company_name}}? (your stack, X yrs)"
body = """
Hi {{founder_first_name}},

Saw {{company_name}} in YC {{batch}}{{one_liner_clause}} and wanted to reach out directly. I'd love to be the engineer who helps you ship it fast.

Why I think I can help {{company_name}} from day one:

{{highlights}}

Based in your city, open to remote or relocation. CV attached, more at {{portfolio}}.

Worth a 15-minute call this week? If the timing is off, a quick "not now" helps too.

{{applicant_first_name}}
"""

[storage]
database_path = "stagezero.db"

[outreach]
min_delay_secs = 2
max_delay_secs = 5
daily_limit = 20
